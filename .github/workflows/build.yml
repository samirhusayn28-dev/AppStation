name: Build AppStation

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            artifact: AppStation-windows
            spec: AppStation.win.spec
            python: '3.12'
          - os: macos-15-intel
            name: macOS Intel
            artifact: AppStation-macos-intel
            spec: AppStation.spec
            python: '3.12'
          - os: macos-latest
            name: macOS Apple Silicon
            artifact: AppStation-macos-arm64
            spec: AppStation.spec
            python: '3.12'

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller --clean --noconfirm ${{ matrix.spec }}

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $env:Path += ";C:\Program Files\NSIS;C:\Program Files (x86)\NSIS"
          makensis installer.nsi
          Compress-Archive -Path dist\AppStation\* -DestinationPath AppStation-windows-portable.zip -Force

      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          hdiutil create -volname "AppStation" \
            -srcfolder dist/AppStation.app -ov -format UDZO ${{ matrix.artifact }}.dmg
          python install.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            *.exe
            *.zip
            *.dmg
            *.pkg
          retention-days: 30
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: AppStation ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/AppStation-windows/AppStation-Setup-1.0.4.exe
            artifacts/AppStation-windows/AppStation-windows-portable.zip
            artifacts/AppStation-macos-intel/*.dmg
            artifacts/AppStation-macos-intel/*.pkg
            artifacts/AppStation-macos-arm64/*.dmg
            artifacts/AppStation-macos-arm64/*.pkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
